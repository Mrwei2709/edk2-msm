name: Locate UsbHubEnumeration definition
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find function definition
        run: |
          DIR="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe"
          grep -n "^VOID EFIAPI UsbHubEnumeration" "$DIR/UsbHub.c" -A50
