name: Build with boot img and find output
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: Patch UsbHubEnumeration TPL wrap
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          sed -i '1016a\  EFI_TPL           OldTpl;' "$FILE"
          sed -i '1022a\  OldTpl = gBS->RaiseTPL (TPL_CALLBACK);' "$FILE"
          sed -i '1036i\    gBS->RestoreTPL (OldTpl);' "$FILE"
          sed -i '1055a\  gBS->RestoreTPL (OldTpl);' "$FILE"

      - name: Build UEFI with boot image
        run: |
          ./build.sh -d judyln -r DEBUG -u -b -D USB_HOTPLUG=1

      - name: Find output files
        run: |
          echo "=== root files ==="
          ls -la
          echo "=== output dir ==="
          ls -la output/ 2>/dev/null || echo "no output dir at root"
          echo "=== workspace ==="
          ls -la workspace/ 2>/dev/null || echo "no workspace dir"
          echo "=== find all .img ==="
          find . -name "*.img" -type f 2>/dev/null
          echo "=== find judyln related ==="
          find . -iname "*judyln*" -type f 2>/dev/null
