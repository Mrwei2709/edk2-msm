name: Locate dsc + dump root hub enum
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find dsc and dump root hub
        run: |
          echo "=== find judyln dsc ==="
          find . -name "judyln.dsc" -type f 2>/dev/null

          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          HEADER="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbBus.h"

          echo "=== USB_BUS_TPL define ==="
          grep -n "USB_BUS_TPL" "$HEADER"

          echo "=== UsbRootHubEnumeration ==="
          grep -n -A50 "UsbRootHubEnumeration (" "$FILE"
