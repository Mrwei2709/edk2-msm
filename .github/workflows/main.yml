name: Build judyln LG G710N UEFI (Only Windows Boot)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm \
            device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 替换simpleinit配置，只保留Windows引导、跳过菜单
        run: |
          cat > simpleinit.static.uefi.cfg <<'EOF'
[global]
auto_boot = true
timeout = 0

[windows]
mode = "efi"
enabled = true
desc = "Windows"
show = false
efi_file = "\EFI\Boot\bootaa64.efi"
EOF

      - name: Build UEFI judyln RELEASE
        run: |
          ./build.sh --device judyln -r RELEASE

      - name: Upload boot-judyln.img
        uses: actions/upload-artifact@v4
        with:
          name: judyln-uefi-winonly-release
          path: |
            Build/judyln/RELEASE/boot-judyln.img
          retention-days: 14
