name: Find build output in edk2
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: Patch UsbHubEnumeration TPL wrap
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          sed -i '1016a\  EFI_TPL           OldTpl;' "$FILE"
          sed -i '1022a\  OldTpl = gBS->RaiseTPL (TPL_CALLBACK);' "$FILE"
          sed -i '1036i\    gBS->RestoreTPL (OldTpl);' "$FILE"
          sed -i '1055a\  gBS->RestoreTPL (OldTpl);' "$FILE"

      - name: Build UEFI
        run: |
          ./build.sh -d judyln -r DEBUG -u -b -D USB_HOTPLUG=1 2>&1 | tail -80

      - name: Search output files
        run: |
          echo "=== Build dir in edk2 ==="
          ls -la Common/edk2/Build/ 2>/dev/null || echo "no Build dir"
          echo "=== find fd/img in edk2 ==="
          find Common/edk2 -type f \( -name "*.fd" -o -name "*.img" \) 2>/dev/null | head -30
          echo "=== judyln device config ==="
          cat configs/devices/judyln.conf
