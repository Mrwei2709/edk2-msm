name: Dump UsbEnumeratePort TPL usage
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find and dump UsbEnumeratePort
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          grep -n "UsbEnumeratePort (" "$FILE"
          echo "=== first 60 lines ==="
          START=$(grep -n "UsbEnumeratePort (" "$FILE" | head -n1 | cut -d: -f1)
          sed -n "${START},+60p" "$FILE"
          echo "=== all TPL/RaiseTPL in UsbEnumer.c ==="
          grep -n -E "RaiseTPL|RestoreTPL|TPL_" "$FILE"
