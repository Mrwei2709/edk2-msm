name: Fix early return TPL leak
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: RestoreTPL before early return
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          sed -i 's/^    return;$/    gBS->RestoreTPL (OldTpl); return;/' "$FILE"

      - name: Verify
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          grep -n -A2 "ChangeMap == NULL" "$FILE"
          grep -n "RestoreTPL (OldTpl)" "$FILE"
