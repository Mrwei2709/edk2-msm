name: Locate Usb Hotplug Code
on:
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Search hotplug related symbols in UsbBus.c
        run: |
          SRC="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbBus.c"
          echo "=== grep -i hotplug ==="
          grep -n -i "hotplug" "$SRC" || echo "(no hotplug)"
          echo "=== grep UsbHubEnumeration ==="
          grep -n "UsbHubEnumeration" "$SRC" || echo "(no UsbHubEnumeration)"
          echo "=== grep Timer/CreateEvent ==="
          grep -n -E "Timer|CreateEvent|TPL_CALLBACK" "$SRC" || echo "(none)"
