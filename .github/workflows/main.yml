name: Build judyln LG G710N UEFI (Only Windows Boot)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm \
            device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 替换simpleinit配置，只保留Windows引导、跳过菜单
        run: |
          echo '[global]' > simpleinit.static.uefi.cfg
          echo 'auto_boot = true' >> simpleinit.static.uefi.cfg
          echo 'timeout = 0' >> simpleinit.static.uefi.cfg
          echo '' >> simpleinit.static.uefi.cfg
          echo '[windows]' >> simpleinit.static.uefi.cfg
          echo 'mode = "efi"' >> simpleinit.static.uefi.cfg
          echo 'enabled = true' >> simpleinit.static.uefi.cfg
          echo 'desc = "Windows"' >> simpleinit.static.uefi.cfg
          echo 'show = false' >> simpleinit.static.uefi.cfg
          echo 'efi_file = "\\EFI\\Boot\\bootaa64.efi"' >> simpleinit.static.uefi.cfg

      - name: Build UEFI judyln RELEASE
        run: |
          ./build.sh --device judyln -r RELEASE

      - name: Upload boot-judyln.img
        uses: actions/upload-artifact@v4
        with:
          name: judyln-uefi-winonly-release
          path: |
            Build/judyln/RELEASE/boot-judyln.img
          retention-days: 14
