name: Check USB config + root hub enum
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check judyln dsc USB config
        run: |
          DSC="Platform/LG/sdm845/judyln.dsc"
          echo "=== USB related defines ==="
          grep -i -E "usb|hotplug|UsbBus" "$DSC"
          echo "=== UsbBusDxe section ==="
          grep -A10 "UsbBusDxe" "$DSC"

      - name: Dump UsbRootHubEnumeration
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          grep -n -A40 "UsbRootHubEnumeration (" "$FILE"
