name: Locate UsbHotPlugCallback
on:
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Locate UsbHotPlugCallback function
        run: |
          SRC="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbBus.c"
          echo "=== file exists? ==="
          ls -la "$SRC" || echo "FILE NOT FOUND at this path"
          echo "=== grep UsbHotPlugCallback ==="
          grep -n -A15 "UsbHotPlugCallback" "$SRC"
