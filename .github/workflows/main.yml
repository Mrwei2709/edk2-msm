name: Build judyln LG G710N
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: 拉取源码+子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 修补 UsbHubEnumeration TPL 保护
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          sed -i '1016a\  EFI_TPL           OldTpl;' "$FILE"
          sed -i '1022a\  OldTpl = gBS->RaiseTPL (TPL_CALLBACK);' "$FILE"
          sed -i '1036i\    gBS->RestoreTPL (OldTpl);' "$FILE"
          sed -i '1055a\  gBS->RestoreTPL (OldTpl);' "$FILE"

      - name: 编译 G710N judyln UEFI（DEBUG + USB键盘 + USB串口控制台）
        run: |
          ./build.sh --device judyln -r DEBUG -u

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: G710N-judyln-uefi-tplfix
          path: ./boot-judyln.img
