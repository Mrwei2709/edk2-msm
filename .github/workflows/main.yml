name: Dump UsbHubEnumeration body
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract UsbHubEnumeration
        run: |
          DIR="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe"
          sed -n '1012,1072p' "$DIR/UsbEnumer.c"
