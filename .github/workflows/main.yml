name: Build Judyln UEFI
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext patch

      - name: Apply USB HotPlug TPL fix patch
        run: |
          patch -p1 < usb-hotplug-tpl-fix.patch

      - name: Verify patch applied
        run: |
          grep -n "CurrTpl = gBS->RaiseTPL (TPL_HIGH_LEVEL);" MdeModulePkg/Bus/Usb/UsbBusDxe/UsbBus.c || (echo "Patch apply failed!" && exit 1)

      - name: Build UEFI
        run: |
          ./build.sh --device judyln -r DEBUG -u -D USB_HOTPLUG=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: judyln-uefi-debug
          path: ./boot-judyln.img
