name: Build judyln LG G710N
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: 拉取源码+子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext
      - name: 仅修改根Hub枚举事件为TPL_APPLICATION
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbHub.c"
          # 只改根hub定时器事件（第977行），普通hub保持不变
          sed -i '977s/TPL_CALLBACK/TPL_APPLICATION/' "$FILE"
      - name: 编译 G710N judyln UEFI（DEBUG + USB键盘 + USB串口控制台）
        run: |
          ./build.sh --device judyln -r DEBUG -u
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: G710N-judyln-uefi-roothub-tpl-fix
          path: ./boot-judyln.img
