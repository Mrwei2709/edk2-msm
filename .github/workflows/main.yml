name: Build judyln LG G710N
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: 拉取源码+子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 动态Patch UsbHotPlugCallback TPL断言修复
        run: |
          FILE="MdeModulePkg/Bus/Usb/UsbBusDxe/UsbBus.c"
          cat > patch-tpl.sed <<'EOF'
          /OldTpl = RaiseTPL (TPL_CALLBACK);/,/RestoreTPL (OldTpl);/c\
          {\
            EFI_TPL         CurrTpl;\
            CurrTpl = gBS->RaiseTPL (TPL_HIGH_LEVEL);\
            gBS->RestoreTPL (CurrTpl);\
            if (CurrTpl < TPL_CALLBACK) {\
              OldTpl = gBS->RaiseTPL (TPL_CALLBACK);\
            } else {\
              OldTpl = CurrTpl;\
            }\
            // ========== 临界区业务代码 ==========\
            if (OldTpl != CurrTpl) {\
              gBS->RestoreTPL (OldTpl);\
            }\
          }
          EOF
          sed -f patch-tpl.sed -i "${FILE}"
          rm patch-tpl.sed

      - name: 编译 G710N judyln UEFI（DEBUG + USB键盘 + USB串口控制台 + USB_HOTPLUG）
        run: |
          ./build.sh --device judyln -r DEBUG -u -D USB_HOTPLUG=1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: G710N-judyln-uefi
          path: ./boot-judyln.img
