name: Full build log + find output
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: Patch UsbHubEnumeration TPL wrap
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          sed -i '1016a\  EFI_TPL           OldTpl;' "$FILE"
          sed -i '1022a\  OldTpl = gBS->RaiseTPL (TPL_CALLBACK);' "$FILE"
          sed -i '1036i\    gBS->RestoreTPL (OldTpl);' "$FILE"
          sed -i '1055a\  gBS->RestoreTPL (OldTpl);' "$FILE"

      - name: Build UEFI (full log)
        run: |
          ./build.sh -d judyln -r DEBUG -u -b -D USB_HOTPLUG=1 2>&1
          echo "=== build exit code: $? ==="

      - name: Search all output artifacts
        run: |
          echo "=== all Build dirs ==="
          find . -type d -name "Build" 2>/dev/null
          echo "=== all .fd files ==="
          find . -type f -name "*.fd" 2>/dev/null
          echo "=== all .img files ==="
          find . -type f -name "*.img" 2>/dev/null
          echo "=== mkbootimg / boot related ==="
          find . -type f -name "mkbootimg" -o -name "boot*.img" 2>/dev/null
