name: Build judyln LG G710N UEFI (Only Windows Boot)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm \
            device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: Build UEFI (judyln, Windows only, Release)
        run: |
          # 关键参数说明
          # --no-android 关闭Android引导；--no-linux 关闭Linux引导；--no-simpleinit-menu 屏蔽启动选择菜单
          ./build.sh --device judyln -r RELEASE --no-android --no-linux --no-simpleinit-menu

      - name: Upload compiled boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: judyln-uefi-winonly-release
          path: |
            Build/judyln/RELEASE/boot-judyln.img
          retention-days: 14
