name: Dump UsbHubEnumeration func start
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find UsbHubEnumeration and print first 40 lines
        run: |
          DIR="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe"
          grep -n -A40 "UsbHubEnumeration" "$DIR/UsbHub.c"
