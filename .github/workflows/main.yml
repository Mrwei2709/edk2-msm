name: Dump UsbHubEnumeration context
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract UsbHub.c around line 663
        run: |
          DIR="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe"
          sed -n '650,680p' "$DIR/UsbHub.c"
