name: Dump hub interrupt + root hub event create
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Dump UsbOnHubInterrupt + root hub event
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbHub.c"

          echo "=== UsbOnHubInterrupt ==="
          grep -n -A40 "UsbOnHubInterrupt (" "$FILE"

          echo "=== root hub CreateEvent ==="
          grep -n -B2 -A8 "CreateEvent" "$FILE"
