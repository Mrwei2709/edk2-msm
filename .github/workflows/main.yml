name: Build judyln LG G710N UEFI (Windows Only, SimpleInit Removed)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm \
            device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 阉割 SimpleInit（从固件打包列表彻底移除）
        run: |
          echo "===== 命中文件 ====="
          grep -rIlE "SimpleInitMain|Library/SimpleInit" --include=*.dsc --include=*.fdf --include=*.inc Platform Silicon || echo "(无命中)"

          files=$(grep -rIlE "SimpleInitMain|Library/SimpleInit" --include=*.dsc --include=*.fdf --include=*.inc Platform Silicon || true)
          if [ -z "$files" ]; then echo "未找到 SimpleInit 注册行"; exit 1; fi

          for f in $files; do
            cp "$f" "$f.bak"
            sed -i -E 's@^([[:space:]]*)(.*(SimpleInitMain|Library/SimpleInit).*)@\1# \2@' "$f"
          done

          echo "===== 修改后 ====="
          grep -rnE "(SimpleInitMain|Library/SimpleInit)" --include=*.dsc --include=*.fdf --include=*.inc Platform Silicon || echo "已全部注释，SimpleInit 不再进固件"

      - name: Build UEFI judyln RELEASE
        run: |
          ./build.sh --device judyln -r RELEASE
          mkdir -p out
          find . -name "boot-judyln.img" -not -path "*/Common/*" -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: judyln-uefi-winonly
          path: out/boot-judyln.img
          if-no-files-found: error
          retention-days: 14
