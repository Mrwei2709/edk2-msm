name: Dump UsbEnumerateNewDev function
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Dump UsbEnumerateNewDev
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          START=$(grep -n "UsbEnumerateNewDev (" "$FILE" | head -n1 | cut -d: -f1)
          echo "=== starts at line $START ==="
          sed -n "${START},+120p" "$FILE"
