name: Build judyln LG G710N
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: 拉取源码+子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 编译 G710N judyln UEFI（DEBUG + USB，不开启热插拔）
        run: |
          set -e
          ./build.sh --device judyln -r DEBUG -u

      - name: 查找镜像
        run: |
          ls -la ./output/
          find . -name "boot-judyln.img"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: G710N-judyln-uefi
          path: ./output/boot-judyln.img
