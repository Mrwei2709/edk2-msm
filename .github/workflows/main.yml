name: Build judyln LG G710N UEFI (Trimmed, Only Windows EFI Boot)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [judyln]
    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm \
            device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: 【源码阉割】sed 删除 Android Linux PE 加载模块
        run: |
          cp GPLDrivers/Library/SimpleInit/SimpleInitMain.inf GPLDrivers/Library/SimpleInit/SimpleInitMain.inf.bak
          sed -i '/AndroidLoader\.c/d' GPLDrivers/Library/SimpleInit/SimpleInitMain.inf
          sed -i '/LinuxLoader\.c/d' GPLDrivers/Library/SimpleInit/SimpleInitMain.inf
          sed -i '/PeLoader\.c/d' GPLDrivers/Library/SimpleInit/SimpleInitMain.inf

      - name: 配置simpleinit自动直接启动Windows
        run: |
          echo '[global]' > simpleinit.static.uefi.cfg
          echo 'auto_boot = true' >> simpleinit.static.uefi.cfg
          echo 'timeout = 0' >> simpleinit.static.uefi.cfg
          echo '' >> simpleinit.static.uefi.cfg
          echo '[windows]' >> simpleinit.static.uefi.cfg
          echo 'mode = "efi"' >> simpleinit.static.uefi.cfg
          echo 'enabled = true' >> simpleinit.static.uefi.cfg
          echo 'desc = "Windows"' >> simpleinit.static.uefi.cfg
          echo 'show = false' >> simpleinit.static.uefi.cfg
          echo 'efi_file = "\\EFI\\Boot\\bootaa64.efi"' >> simpleinit.static.uefi.cfg

      - name: Build UEFI judyln RELEASE
        run: |
          ./build.sh --device judyln -r RELEASE
          ls -la boot-judyln.img

      - name: Upload boot-judyln.img
        uses: actions/upload-artifact@v4
        with:
          name: judyln-uefi-trim-winonly
          path: boot-judyln.img
          retention-days: 14
