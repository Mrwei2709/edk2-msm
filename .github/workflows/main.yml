name: Find build output location
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-setuptools gcc-aarch64-linux-gnu clang llvm device-tree-compiler uuid-dev nasm acpica-tools libglib2.0-dev gettext

      - name: Patch UsbHubEnumeration TPL wrap
        run: |
          FILE="Common/edk2/MdeModulePkg/Bus/Usb/UsbBusDxe/UsbEnumer.c"
          sed -i '1016a\  EFI_TPL           OldTpl;' "$FILE"
          sed -i '1022a\  OldTpl = gBS->RaiseTPL (TPL_CALLBACK);' "$FILE"
          sed -i '1036i\    gBS->RestoreTPL (OldTpl);' "$FILE"
          sed -i '1055a\  gBS->RestoreTPL (OldTpl);' "$FILE"

      - name: Build UEFI
        run: |
          ./build.sh -d judyln -r DEBUG -u -D USB_HOTPLUG=1

      - name: Inspect output
        run: |
          echo "=== top dirs ==="
          ls -d */
          echo "=== Build directory ==="
          ls -la Build/ 2>/dev/null || echo "no Build dir at root"
          echo "=== find all img/fd/efi ==="
          find . -type f \( -name "*.img" -o -name "*.fd" -o -name "*.efi" \) | head -60
          echo "=== find boot* files ==="
          find . -name "boot*" -type f
          echo "=== build.sh help ==="
          ./build.sh -h 2>&1 | head -40
